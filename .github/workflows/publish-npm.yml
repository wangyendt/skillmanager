name: Publish npm

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  publish:
    if: vars.AUTO_PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check whether version already exists on npm
        id: npm_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if npm view "@wang121ye/skillmanager@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        if: steps.npm_version.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is empty; skip publish."
            exit 0
          fi
          npm publish --access public
