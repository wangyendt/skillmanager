name: Publish npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: skilltruck-publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.AUTO_PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Check whether version already exists on npm
        id: npm_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if npm view "skilltruck@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Ensure git tag exists for published version
        if: steps.npm_version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.npm_version.outputs.version }}
        run: |
          TAG_NAME="${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            echo "Tag ${TAG_NAME} already exists; skip."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"
